# kind cluster config — 1 control plane + 3 workers, with port mappings for ingress
# https://kind.sigs.k8s.io/docs/user/configuration/
apiVersion: kind.x-k8s.io/v1alpha4
kind: Cluster
name: lab
networking:
  # Default kind subnet conflicts on some Windows setups; fix by being explicit.
  podSubnet: "10.244.0.0/16"
  serviceSubnet: "10.96.0.0/16"
  # Disable the default kindnet CNI so we can install Calico/Cilium later if we want.
  # Leave default for first install; flip to true for advanced CNI labs.
  disableDefaultCNI: false
nodes:
  - role: control-plane
    image: kindest/node:v1.30.0
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP
      - containerPort: 30000
        hostPort: 30000
        protocol: TCP
  - role: worker
    image: kindest/node:v1.30.0
    labels:
      zone: a
      tier: app
  - role: worker
    image: kindest/node:v1.30.0
    labels:
      zone: b
      tier: app
  - role: worker
    image: kindest/node:v1.30.0
    labels:
      zone: b
      tier: data
