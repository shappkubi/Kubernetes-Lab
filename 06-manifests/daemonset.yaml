# DaemonSet shaped like a logging or node-monitoring agent: tolerates ALL taints
# (so it lands on control-plane and tainted nodes), reads node labels, hostNetwork off by default.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: log-agent
  namespace: kube-system
  labels: { app: log-agent }
spec:
  selector:
    matchLabels: { app: log-agent }
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels: { app: log-agent }
    spec:
      serviceAccountName: log-agent
      tolerations:
        - operator: Exists                 # land on every node, taints or not
      priorityClassName: system-node-critical
      containers:
        - name: agent
          image: fluent/fluent-bit:3.1
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits:   { memory: 128Mi }
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef: { fieldPath: spec.nodeName }
          volumeMounts:
            - { name: varlog, mountPath: /var/log, readOnly: true }
            - { name: varlibcontainers, mountPath: /var/lib/containers, readOnly: true }
      volumes:
        - { name: varlog, hostPath: { path: /var/log } }
        - { name: varlibcontainers, hostPath: { path: /var/lib/containers } }
