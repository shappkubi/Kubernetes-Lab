# All four ways to consume config and secrets, in one demo Pod.
---
apiVersion: v1
kind: ConfigMap
metadata: { name: app-config }
data:
  GREETING: "hello"
  LOG_LEVEL: "info"
  app.properties: |
    server.port=8080
    server.timeout=30s
---
apiVersion: v1
kind: Secret
metadata: { name: app-secret }
type: Opaque
stringData:                           # stringData is plaintext at write time, base64'd by the API server
  DB_PASSWORD: "s3cret!"
  api.key: "abc123"
---
apiVersion: v1
kind: Pod
metadata: { name: cfg-demo }
spec:
  containers:
    - name: c
      image: busybox
      command:
        - sh
        - -c
        - |
          echo "From env (1 by 1):  GREETING=$GREETING"
          echo "From envFrom:        LOG_LEVEL=$LOG_LEVEL"
          echo "From file:           $(cat /etc/cfg/app.properties)"
          echo "Secret as file:      $(cat /etc/secret/api.key)"
          sleep 3600
      env:
        # 1) single env var from a ConfigMap key
        - name: GREETING
          valueFrom:
            configMapKeyRef: { name: app-config, key: GREETING }
        # 2) single env var from a Secret key
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef: { name: app-secret, key: DB_PASSWORD }
      envFrom:
        # 3) all keys of a ConfigMap as env vars
        - configMapRef: { name: app-config }
      volumeMounts:
        # 4) ConfigMap and Secret as files
        - { name: cfg, mountPath: /etc/cfg, readOnly: true }
        - { name: sec, mountPath: /etc/secret, readOnly: true }
  volumes:
    - { name: cfg, configMap: { name: app-config } }
    - { name: sec, secret: { secretName: app-secret, defaultMode: 0400 } }
