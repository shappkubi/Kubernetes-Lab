# Gateway API equivalent of common Ingress patterns.
# Gateway API is the modern replacement for Ingress — needs a controller that supports it
# (ingress-nginx, Envoy Gateway, Istio, Cilium, etc.).
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata: { name: nginx }
spec:
  controllerName: k8s.io/ingress-nginx
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: web-gateway
  namespace: gateway-system
spec:
  gatewayClassName: nginx
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
    - name: https
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: www-example-com-tls
            namespace: gateway-system
      allowedRoutes:
        namespaces:
          from: All
---
# HTTPRoute — replaces Ingress rules. Tied to the Gateway above by parentRefs.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: web
  namespace: app
spec:
  parentRefs:
    - name: web-gateway
      namespace: gateway-system
  hostnames: [www.example.com]
  rules:
    - matches:
        - path: { type: PathPrefix, value: /api }
      backendRefs:
        - name: api
          port: 80
          weight: 100
    - matches:
        - path: { type: PathPrefix, value: / }
      backendRefs:
        # Canary: 90% to stable, 10% to new.
        - { name: web-stable, port: 80, weight: 90 }
        - { name: web-canary, port: 80, weight: 10 }
